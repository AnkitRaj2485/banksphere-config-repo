spring:
  application:
    name: account-service

server:
  port: 8083

  datasource:
    url: jdbc:mysql://localhost:3306/account_service?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  kafka:
    producer:
      bootstrap-servers: localhost:9092