spring:
  application:
    name: identity-service

server:
  port: 8084

  datasource:
    url: jdbc:mysql://localhost:3306/identity_service?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: ${JWT_SECRET:your-256-bit-base64-secret-key-change-in-production}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000