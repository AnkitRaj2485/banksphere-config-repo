spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/banksphere_dev?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop  # Create fresh schema on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  kafka:
    bootstrap-servers: localhost:9092

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

server:
  port: ${SERVICE_PORT:8080}  # Default port, can be overridden

logging:
  level:
    root: INFO
    com.cts: DEBUG
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Development-specific settings
management:
  endpoints:
    web:
      exposure:
        include: '*'  # Expose all endpoints in dev