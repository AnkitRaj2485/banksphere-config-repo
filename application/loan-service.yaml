spring:
  application:
    name: loan-service

server:
  port: 8085

  datasource:
    url: jdbc:mysql://localhost:3306/loan_service?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
